services:
  db:
    image: postgres:16-alpine
    container_name: chacara-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: chacara
      POSTGRES_USER: chacara
      POSTGRES_PASSWORD: chacara_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chacara -d chacara']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
